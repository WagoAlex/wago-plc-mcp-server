# Firmware update authorization.
#
# This file IS the authorization. fw_update.py / fleet.py refuse to flash any
# device unless it appears here with the exact revision the resolved bundle
# declares, the file is tracked by git, and the working-tree copy matches the
# committed one. `git show <sha>` afterwards answers "who approved this flash".
#
# Set FW_REQUIRE_SIGNED_COMMIT=true to additionally require a signed HEAD.
#
#   host IP: exact bundle revision (as printed by build_catalog.py)
