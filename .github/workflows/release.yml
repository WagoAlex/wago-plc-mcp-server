name: Release

# Triggered manually from the Actions tab.
# This is the only path that publishes to Docker Hub and creates a GitHub Release.
# Local builds: ./build.sh --patch (no push) or ./build.sh --patch --release (push + tag).
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  — Docker Hub account (wagoalex)
#   DOCKERHUB_TOKEN     — Docker Hub access token (not your password)
#
# The version-bump commit lands on main via a PR (see "Open version-bump PR"
# below), not a direct push - a direct push to HEAD:main was silently rejected
# by branch protection while the tag/image still went out, which is exactly
# how v2.3.0 ended up tagged and on Docker Hub without ever reaching main
# (fixed 2026-09-15). The tag itself still pushes straight to origin.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      no_cache:
        description: Build without Docker layer cache
        type: boolean
        default: false

jobs:
  release:
    name: Build · Push · Release
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push tag + release branch + create GitHub Release
      pull-requests: write   # open the version-bump PR against main
      security-events: write # upload SARIF if we extend with CVE scan here later

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0     # full history so git tag history is intact

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # docker/setup-buildx-action@v3 and docker/login-action@v3 use Node.js 20
      # which GitHub forced to Node.js 24 on 2026-06-16, breaking secret injection.
      # Using plain shell commands until upstream actions ship Node.js 24 builds.
      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name ci-builder
          docker buildx inspect --bootstrap

      # Username is public (matches image wagoalex/wago-plc-mcp-server); only the token is secret.
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "wagoalex" --password-stdin

      # Installs syft to PATH so build.sh can call it directly
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Run build.sh
        run: |
          chmod +x build.sh
          FLAGS="--${{ inputs.bump }} --release --ci"
          [[ "${{ inputs.no_cache }}" == "true" ]] && FLAGS="$FLAGS --no-cache"
          ./build.sh $FLAGS

      - name: Read bumped version
        id: ver
        run: echo "value=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      # Push just the tag straight to origin - tag refs aren't covered by
      # branch protection, so this always lands regardless of main's rules.
      - name: Push tag
        run: git push origin "v${{ steps.ver.outputs.value }}"

      # The version-bump commit goes to main through a PR instead of a direct
      # push, so branch protection can't silently swallow it. Docker Hub and
      # the tag are already live at this point either way.
      - name: Open version-bump PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="release/v${{ steps.ver.outputs.value }}"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: release v${{ steps.ver.outputs.value }}" \
            --body "Version bump for v${{ steps.ver.outputs.value }}. Docker image (\`wagoalex/wago-plc-mcp-server:${{ steps.ver.outputs.value }}\`) and the tag are already published - this only lands the version-bump commit on main."

      # Upload SBOM to the GitHub Release as a downloadable asset.
      # The SBOM file at repo root is produced by build.sh (image-based, CycloneDX JSON).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.value }}
          name: v${{ steps.ver.outputs.value }}
          generate_release_notes: true
          files: sbom-${{ steps.ver.outputs.value }}.json

      # Keep the SBOM as a workflow artifact for 90 days (mirrors cve-scan.yml retention)
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ steps.ver.outputs.value }}-${{ github.sha }}
          path: sbom-${{ steps.ver.outputs.value }}.json
          retention-days: 90
