name: Release

# Triggered manually from the Actions tab.
# This is the only path that publishes to Docker Hub and creates a GitHub Release.
# Local builds: ./build.sh --patch (no push) or ./build.sh --patch --release (push + tag).
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  - Docker Hub account (wagoalex)
#   DOCKERHUB_TOKEN     - Docker Hub access token (not your password)
#   PYPI_API_TOKEN      - PyPI API token scoped to the wago-plc-mcp-server project
#
# The version-bump commit lands on main via a PR (see "Open version-bump PR"
# below), not a direct push - a direct push to HEAD:main was silently rejected
# by branch protection while the tag/image still went out, which is exactly
# how v2.3.0 ended up tagged and on Docker Hub without ever reaching main
# (fixed 2026-09-15). The tag itself still pushes straight to origin.
#
# Resuming a half-finished release: if a run already pushed the Docker image and
# the tag but failed before the remaining channels, run again with
# `resume_version` set (e.g. 2.3.1). That skips bump/build/push/tag and publishes
# the GitHub Release (SBOM regenerated from the pushed image), PyPI, the MCP
# Registry and the .mcpb from the existing tag. `bump` is ignored in that mode.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      no_cache:
        description: Build without Docker layer cache
        type: boolean
        default: false
      resume_version:
        description: Resume an already tagged release (e.g. 2.3.1) - skips bump/build/push
        required: false
        type: string
        default: ""

jobs:
  release:
    name: Build · Push · Release
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push tag + release branch + create GitHub Release
      pull-requests: write   # open the version-bump PR against main
      security-events: write # upload SARIF if we extend with CVE scan here later
    outputs:
      version: ${{ steps.ver.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0     # full history so git tag history is intact

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # docker/setup-buildx-action@v3 and docker/login-action@v3 use Node.js 20
      # which GitHub forced to Node.js 24 on 2026-06-16, breaking secret injection.
      # Using plain shell commands until upstream actions ship Node.js 24 builds.
      - name: Set up Docker Buildx
        if: inputs.resume_version == ''
        run: |
          docker buildx create --use --name ci-builder
          docker buildx inspect --bootstrap

      # Username is public (matches image wagoalex/wago-plc-mcp-server); only the token is secret.
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "wagoalex" --password-stdin

      # Installs syft to PATH so build.sh can call it directly
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Run build.sh
        if: inputs.resume_version == ''
        run: |
          chmod +x build.sh
          FLAGS="--${{ inputs.bump }} --release --ci"
          [[ "${{ inputs.no_cache }}" == "true" ]] && FLAGS="$FLAGS --no-cache"
          ./build.sh $FLAGS

      - name: Check out existing release tag
        if: inputs.resume_version != ''
        env:
          VERSION: ${{ inputs.resume_version }}
        run: |
          git checkout "v${VERSION}"
          test "$(cat version.txt)" = "${VERSION}" \
            || { echo "::error::version.txt at v${VERSION} is $(cat version.txt)"; exit 1; }

      - name: Read release version
        id: ver
        run: echo "value=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      # Push just the tag straight to origin - tag refs aren't covered by
      # branch protection, so this always lands regardless of main's rules.
      - name: Push tag
        if: inputs.resume_version == ''
        run: git push origin "v${{ steps.ver.outputs.value }}"

      # build.sh wrote the SBOM on a normal run. On resume, rebuild it from the
      # image that is already on Docker Hub (fails if that image was never pushed).
      - name: Regenerate SBOM from pushed image
        if: inputs.resume_version != ''
        env:
          VERSION: ${{ steps.ver.outputs.value }}
        run: syft "docker.io/wagoalex/wago-plc-mcp-server:${VERSION}" -o cyclonedx-json="sbom-${VERSION}.json"

      # Upload SBOM to the GitHub Release as a downloadable asset.
      # The SBOM file at repo root is image-based CycloneDX JSON.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.value }}
          name: v${{ steps.ver.outputs.value }}
          generate_release_notes: true
          files: sbom-${{ steps.ver.outputs.value }}.json

      # Keep the SBOM as a workflow artifact for 90 days (mirrors cve-scan.yml retention)
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ steps.ver.outputs.value }}-${{ github.sha }}
          path: sbom-${{ steps.ver.outputs.value }}.json
          retention-days: 90

      # The version-bump commit goes to main through a PR instead of a direct
      # push, so branch protection can't silently swallow it. Runs last and does
      # not fail the release: the image and tag are public by now, and PyPI,
      # the MCP Registry and the .mcpb must still follow (v2.3.1 stalled here
      # when Actions was not allowed to create PRs). Open the PR by hand if it warns.
      - name: Open version-bump PR
        if: inputs.resume_version == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="release/v${{ steps.ver.outputs.value }}"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: release v${{ steps.ver.outputs.value }}" \
            --body "Version bump for v${{ steps.ver.outputs.value }}. Docker image (\`wagoalex/wago-plc-mcp-server:${{ steps.ver.outputs.value }}\`) and the tag are already published - this only lands the version-bump commit on main."

  # PyPI gets the same version as Docker Hub on every release, so `uvx
  # wago-plc-mcp-server` never lags behind again (it sat at 2.1.1 while the image
  # reached 2.3.0). Builds from the pushed tag, i.e. the version-bump commit.
  #
  # Safe to re-run ("Re-run failed jobs"): PyPI ignores re-uploads of identical files.
  pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0  # no floating major tag published; node24 runtime
        with:
          enable-cache: false

      - name: Build
        run: uv build

      - name: Check built version matches release
        run: |
          ls dist/
          test -f "dist/wago_plc_mcp_server-${{ needs.release.outputs.version }}-py3-none-any.whl"

      - name: Smoke test wheel (stdio initialize)
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | TRANSPORT=stdio WAGO_PLC_HOSTS='' AUDIT_LOG_FILE=/tmp/audit.log LOG_LEVEL=WARNING \
              uvx --from dist/*.whl wago-plc-mcp-server \
            | tee /tmp/init.json
          grep -q '"version":"${{ needs.release.outputs.version }}"' /tmp/init.json

      - name: Publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --trusted-publishing never

  # MCP Registry entry io.github.WagoAlex/wago-plc-mcp-server. Runs after PyPI and the
  # Docker push because the registry checks that both packages in server.json exist
  # and carry the ownership marker (README mcp-name / Dockerfile label).
  # Login is GitHub OIDC for the repo owner's namespace - no stored secret.
  registry:
    name: Publish to MCP Registry
    needs: [release, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # mcp-publisher login github-oidc

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Check version sources agree
        run: python3 scripts/check_versions.py

      - name: Install mcp-publisher
        run: |
          curl -sfL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      # Re-run safe: a version that is already listed counts as done.
      # pipefail: without it the pipe returns tee's status and a failed publish passes.
      - name: Publish
        run: |
          set -o pipefail
          ./mcp-publisher login github-oidc
          if ! ./mcp-publisher publish 2>&1 | tee /tmp/publish.log; then
            grep -qi "already exists" /tmp/publish.log || exit 1
            echo "version already listed - nothing to do"
          fi

  # Claude Desktop extension, attached to the GitHub Release created above.
  mcpb:
    name: Attach .mcpb to GitHub Release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write        # upload release asset

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Pack bundle
        run: integrations/mcpb/pack.sh

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release upload "v${VERSION}" "integrations/mcpb/wago-plc-mcp-server-${VERSION}.mcpb" \
            --clobber --repo "${{ github.repository }}"
