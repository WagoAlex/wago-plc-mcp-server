name: Version guard

# The test suite is kept locally and is not part of this repository, so CI only
# checks that every published artifact carries the same version.

on:
  push:
    branches: [main]
    paths:
      - src/**
      - scripts/**
      - Dockerfile
      - pyproject.toml
      - version.txt
      - server.json
      - integrations/mcpb/**
  pull_request:
    paths:
      - src/**
      - scripts/**
      - Dockerfile
      - pyproject.toml
      - version.txt
      - server.json
      - integrations/mcpb/**

jobs:
  versions:
    name: Version sources agree
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # PyPI, Docker, MCP Registry and .mcpb must ship one version (build.sh stamps them)
      - name: Check version sources agree
        run: python3 scripts/check_versions.py
