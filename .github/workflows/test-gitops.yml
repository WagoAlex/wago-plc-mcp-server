name: Tests

on:
  push:
    branches: [main]
    paths:
      - src/**
      - scripts/**
      - tests/**
      - Dockerfile
      - pyproject.toml
  pull_request:
    paths:
      - src/**
      - scripts/**
      - tests/**
      - Dockerfile
      - pyproject.toml

jobs:
  test:
    name: Unit tests (no PLC)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build dev image
        run: docker build --target dev -t wago-plc-mcp-server-dev .

      - name: Run test suite
        run: |
          docker run --rm wago-plc-mcp-server-dev \
            pytest tests/ -v --tb=short \
            -m "not live and not mutate and not soak"
