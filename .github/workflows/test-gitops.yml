name: Tests

on:
  push:
    branches: [main]
    paths:
      - src/**
      - scripts/**
      - tests/**
      - Dockerfile
      - pyproject.toml
      - version.txt
      - server.json
      - integrations/mcpb/**
  pull_request:
    paths:
      - src/**
      - scripts/**
      - tests/**
      - Dockerfile
      - pyproject.toml
      - version.txt
      - server.json
      - integrations/mcpb/**

jobs:
  test:
    name: Unit tests (no PLC)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # PyPI, Docker, MCP Registry and .mcpb must ship one version (build.sh stamps them)
      - name: Check version sources agree
        run: python3 scripts/check_versions.py

      - name: Build dev image
        run: docker build --target dev -t wago-plc-mcp-server-dev .

      - name: Run test suite
        run: |
          docker run --rm wago-plc-mcp-server-dev \
            pytest tests/ -v --tb=short \
            -m "not live and not mutate and not soak"
