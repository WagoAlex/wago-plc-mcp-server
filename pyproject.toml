[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools]
py-modules = ["main", "plc_manager", "enricher", "wda_client", "logging_config", "audit_verify", "mcp_keygen", "gitops", "audit", "safety", "auth", "config"]

[project]
name = "wago-plc-mcp-server"
version = "2.4.2"
description = "MCP server for integrating WAGO PLCs with the WDx REST API"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Alexander Fugmann", email = "alexander.fugmann@wago.com" }]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2.0,<3",  # v2: FastMCP renamed to MCPServer (mcp.server.mcpserver); src/main.py migrated
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "uvicorn>=0.27.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/WagoAlex/wago-plc-mcp-server"
Repository = "https://github.com/WagoAlex/wago-plc-mcp-server"
Issues = "https://github.com/WagoAlex/wago-plc-mcp-server/issues"
Security = "https://github.com/WagoAlex/wago-plc-mcp-server/blob/main/SECURITY.md"

[project.scripts]
wago-plc-mcp-server = "main:cli_main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "httpx[asgi]>=0.28.1",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
markers = [
    "live: requires a reachable PLC — never run in CI",
    "mutate: writes to a PLC — lab-gated only, never in CI",
    "soak: long-running resilience / leak check — on-demand only",
]
