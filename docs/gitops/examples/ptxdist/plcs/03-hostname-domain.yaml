# 03. Hostname and domain
# Firmware generation: PTXdist (FW 04.x, build 31). Do not use on a Yocto PLC.
# Area: Network identity. Device: PFC200 (all PTXdist device classes).
# Use this when you name PLCs by line and position instead of by MAC address.
#
# In your config repository, merge these keys into plcs/<ip>.yaml.
# Keep one file for each PLC. apply.py changes only the keys in the file.
#   Dry run: python scripts/apply.py docs/gitops/examples/ptxdist/plcs/03-hostname-domain.yaml
#   Apply:   python scripts/apply.py docs/gitops/examples/ptxdist/plcs/03-hostname-domain.yaml --execute
plc_ip: 192.168.42.118
managed_parameters:
  0-0-networking-hostname-customname: line1-pfc200-118
  0-0-networking-domain-customdomain: plant.local
