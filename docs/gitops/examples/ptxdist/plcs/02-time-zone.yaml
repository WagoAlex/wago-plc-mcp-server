# 02. Time zone
# Firmware generation: PTXdist (FW 04.x, build 31). Do not use on a Yocto PLC.
# Area: Time. Device: PFC200 (all PTXdist device classes).
# Use this when the local time in logs and HMIs must match the site.
#
# In your config repository, merge these keys into plcs/<ip>.yaml.
# Keep one file for each PLC. apply.py changes only the keys in the file.
#   Dry run: python scripts/apply.py docs/gitops/examples/ptxdist/plcs/02-time-zone.yaml
#   Apply:   python scripts/apply.py docs/gitops/examples/ptxdist/plcs/02-time-zone.yaml --execute
plc_ip: 192.168.42.118
managed_parameters:
  # The value is an instance of the TimeZone list, not a name.
  # 8 = CET (read 0-0-timezone-8-name to check it on your firmware).
  0-0-systemtime-timezone: 8
