# 01. NTP client: time servers and sync interval
# Firmware generation: PTXdist (FW 04.x, build 31). Do not use on a Yocto PLC.
# Area: Time. Device: PFC200 (all PTXdist device classes).
# Use this when all PLCs must use the plant time server.
#
# In your config repository, merge these keys into plcs/<ip>.yaml.
# Keep one file for each PLC. apply.py changes only the keys in the file.
#   Dry run: python scripts/apply.py docs/gitops/examples/ptxdist/plcs/01-ntp-client.yaml
#   Apply:   python scripts/apply.py docs/gitops/examples/ptxdist/plcs/01-ntp-client.yaml --execute
plc_ip: 192.168.42.118
managed_parameters:
  0-0-ntpclient-enabled: true
  0-0-ntpclient-configuredtimeservers:
    - 192.168.42.2
  0-0-ntpclient-updateinterval: 600   # seconds
