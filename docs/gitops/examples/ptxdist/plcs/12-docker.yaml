# 12. Docker engine
# Firmware generation: PTXdist (FW 04.x, build 31). Do not use on a Yocto PLC.
# Area: Runtime. Device: PFC200 (all PTXdist device classes).
# Use this when the PLC runs containers. Docker uses flash memory, so disable it when you do not use it.
#
# In your config repository, merge these keys into plcs/<ip>.yaml.
# Keep one file for each PLC. apply.py changes only the keys in the file.
#   Dry run: python scripts/apply.py docs/gitops/examples/ptxdist/plcs/12-docker.yaml
#   Apply:   python scripts/apply.py docs/gitops/examples/ptxdist/plcs/12-docker.yaml --execute
plc_ip: 192.168.42.118
managed_parameters:
  0-0-docker-enabled: true
