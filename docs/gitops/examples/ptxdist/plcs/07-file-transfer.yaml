# 07. File transfer: FTPS only
# Firmware generation: PTXdist (FW 04.x, build 31). Do not use on a Yocto PLC.
# Area: Access security. Device: PFC200 (all PTXdist device classes).
# Use this when the PLC must encrypt file transfers. FTP sends passwords in plain text.
#
# In your config repository, merge these keys into plcs/<ip>.yaml.
# Keep one file for each PLC. apply.py changes only the keys in the file.
#   Dry run: python scripts/apply.py docs/gitops/examples/ptxdist/plcs/07-file-transfer.yaml
#   Apply:   python scripts/apply.py docs/gitops/examples/ptxdist/plcs/07-file-transfer.yaml --execute
plc_ip: 192.168.42.118
managed_parameters:
  0-0-ftp-enabled: false
  0-0-ftps-enabled: true
