# 11. CODESYS WebVisu web server with login
# Firmware generation: PTXdist (FW 04.x, build 31). Do not use on a Yocto PLC.
# Area: Runtime. Device: PFC200 (not WP400).
# Use this when operators open the WebVisu in a browser. Keep login required.
#
# In your config repository, merge these keys into plcs/<ip>.yaml.
# Keep one file for each PLC. apply.py changes only the keys in the file.
#   Dry run: python scripts/apply.py docs/gitops/examples/ptxdist/plcs/11-codesys-webvisu.yaml
#   Apply:   python scripts/apply.py docs/gitops/examples/ptxdist/plcs/11-codesys-webvisu.yaml --execute
plc_ip: 192.168.42.118
managed_parameters:
  0-0-codesys3-webserver-enabled: true
  0-0-codesys3-webserver-userauthentication-enabled: true
