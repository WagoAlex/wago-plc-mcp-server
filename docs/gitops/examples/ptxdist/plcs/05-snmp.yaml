# 05. SNMP monitoring
# Firmware generation: PTXdist (FW 04.x, build 31). Do not use on a Yocto PLC.
# Area: Monitoring. Device: PFC300 (all PTXdist device classes).
# Use this when a network monitoring system polls the PLCs.
#
# In your config repository, merge these keys into plcs/<ip>.yaml.
# Keep one file for each PLC. apply.py changes only the keys in the file.
#   Dry run: python scripts/apply.py docs/gitops/examples/ptxdist/plcs/05-snmp.yaml
#   Apply:   python scripts/apply.py docs/gitops/examples/ptxdist/plcs/05-snmp.yaml --execute
plc_ip: 192.168.42.119
managed_parameters:
  0-0-snmp-enable: true
  0-0-snmp-location: Building-A-Line-1
  0-0-snmp-contact: ot-team@example.com
  # Community 1 must exist on the PLC. WDA shows communities-1-* only after the
  # first community is configured. A new PLC can need a first setup in the WBM.
  0-0-snmp-communities-1-name: ops-read
  0-0-snmp-communities-1-access: 1   # 1 = read-only
