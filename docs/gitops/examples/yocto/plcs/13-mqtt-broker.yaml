# 13. Local MQTT broker off
# Firmware generation: Yocto (CC100-IEC62443, firmware 02.x). Do not use on a PTXdist PLC.
# Area: Runtime. Tested on: CC100-IEC62443 (0751-9412), firmware 02.00.13.
# Use this when nobody uses the MQTT broker on the PLC. Each service that runs is a possible attack path.
#
# In your config repository, merge these keys into plcs/<ip>.yaml.
#   Dry run: python scripts/apply.py docs/gitops/examples/yocto/plcs/13-mqtt-broker.yaml
#   Apply:   python scripts/apply.py docs/gitops/examples/yocto/plcs/13-mqtt-broker.yaml --execute
plc_ip: 192.168.2.85
managed_parameters:
  0-0-mqttbroker-enabled: false
