# 09. Password rules
# Firmware generation: Yocto (CC100-IEC62443, firmware 02.x). Do not use on a PTXdist PLC.
# Area: Access security. Tested on: CC100-IEC62443 (0751-9412), firmware 02.00.13.
# Use this when your security policy needs longer passwords than the default (8 characters).
#
# In your config repository, merge these keys into plcs/<ip>.yaml.
#   Dry run: python scripts/apply.py docs/gitops/examples/yocto/plcs/09-password-rules.yaml
#   Apply:   python scripts/apply.py docs/gitops/examples/yocto/plcs/09-password-rules.yaml --execute
plc_ip: 192.168.2.85
managed_parameters:
  0-0-accountmanagement-passwordquality-minlength: 12
  0-0-accountmanagement-passwordquality-mincapital: 1
  0-0-accountmanagement-passwordquality-minlowercase: 1
  0-0-accountmanagement-passwordquality-mindigit: 1
  0-0-accountmanagement-passwordquality-minspecial: 1
