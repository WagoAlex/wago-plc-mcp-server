# 03. NTP server on the PLC
# Firmware generation: Yocto (CC100-IEC62443, firmware 02.x). Do not use on a PTXdist PLC.
# Area: Time. Tested on: CC100-IEC62443 (0751-9412), firmware 02.00.13.
# Use this when other devices in the machine take their time from this PLC.
#
# In your config repository, merge these keys into plcs/<ip>.yaml.
#   Dry run: python scripts/apply.py docs/gitops/examples/yocto/plcs/03-ntp-server.yaml
#   Apply:   python scripts/apply.py docs/gitops/examples/yocto/plcs/03-ntp-server.yaml --execute
plc_ip: 192.168.2.85
managed_parameters:
  0-0-ntpserver-enabled: true
  0-0-ntpserver-stratum: 10
  0-0-ntpserver-timesyncprotocol: 0   # 0 = NTP, 1 = NTP + NTS (NTS needs a server certificate)
