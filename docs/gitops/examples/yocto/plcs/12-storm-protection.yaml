# 12. Multicast storm protection
# Firmware generation: Yocto (CC100-IEC62443, firmware 02.x). Do not use on a PTXdist PLC.
# Area: Network protection. Tested on: CC100-IEC62443 (0751-9412), firmware 02.00.13.
# Use this when multicast traffic in the machine network must not overload the PLC.
#
# In your config repository, merge these keys into plcs/<ip>.yaml.
#   Dry run: python scripts/apply.py docs/gitops/examples/yocto/plcs/12-storm-protection.yaml
#   Apply:   python scripts/apply.py docs/gitops/examples/yocto/plcs/12-storm-protection.yaml --execute
plc_ip: 192.168.2.85
managed_parameters:
  0-0-networking-stormprotection-multicastprotection-enabled: true
