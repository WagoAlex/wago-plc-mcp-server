# 02. Time zone
# Firmware generation: Yocto (CC100-IEC62443, firmware 02.x). Do not use on a PTXdist PLC.
# Area: Time. Tested on: CC100-IEC62443 (0751-9412), firmware 02.00.13.
# Use this when the local time in logs must match the site.
#
# In your config repository, merge these keys into plcs/<ip>.yaml.
#   Dry run: python scripts/apply.py docs/gitops/examples/yocto/plcs/02-time-zone.yaml
#   Apply:   python scripts/apply.py docs/gitops/examples/yocto/plcs/02-time-zone.yaml --execute
plc_ip: 192.168.2.85
managed_parameters:
  # An instance of the TimeZone list. On Yocto, 247 = Europe/Berlin (read 0-0-timezone-247-description).
  # On PTXdist, the numbers are different: there, 8 = CET.
  0-0-systemtime-timezone: 247
