# 11. Physical controls off
# Firmware generation: Yocto (CC100-IEC62443, firmware 02.x). Do not use on a PTXdist PLC.
# Area: Access security. Tested on: CC100-IEC62443 (0751-9412), firmware 02.00.13.
# Use this when nobody at the cabinet may change the PLC with its switch or buttons.
# After this, an operator at the cabinet cannot use the mode selector switch or the reset button.
#
# In your config repository, merge these keys into plcs/<ip>.yaml.
#   Dry run: python scripts/apply.py docs/gitops/examples/yocto/plcs/11-physical-controls.yaml
#   Apply:   python scripts/apply.py docs/gitops/examples/yocto/plcs/11-physical-controls.yaml --execute
plc_ip: 192.168.2.85
managed_parameters:
  0-0-physicalcontrols-disableall: true
