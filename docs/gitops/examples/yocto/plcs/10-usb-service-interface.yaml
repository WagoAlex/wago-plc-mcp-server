# 10. USB service interface off
# Firmware generation: Yocto (CC100-IEC62443, firmware 02.x). Do not use on a PTXdist PLC.
# Area: Access security. Tested on: CC100-IEC62443 (0751-9412), firmware 02.00.13.
# Use this when nobody may connect to the PLC with a USB cable.
#
# In your config repository, merge these keys into plcs/<ip>.yaml.
#   Dry run: python scripts/apply.py docs/gitops/examples/yocto/plcs/10-usb-service-interface.yaml
#   Apply:   python scripts/apply.py docs/gitops/examples/yocto/plcs/10-usb-service-interface.yaml --execute
plc_ip: 192.168.2.85
managed_parameters:
  0-0-usbserviceinterface-enabled: false
