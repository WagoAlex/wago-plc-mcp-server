# ─────────────────────────── wago-plc-mcp deployment ───────────────────────────
# Two common deployment patterns. Pick one and remove the other.

secrets:
  plc_default_password:
    file: ./secrets/plc_default_password.txt
  # T1: Bearer auth on /mcp. Create secrets/mcp_api_key.txt first:
  #   echo "$(openssl rand -hex 32)" > secrets/mcp_api_key.txt && chmod 600 secrets/mcp_api_key.txt
  # When the secret file exists, this takes priority over the auto-generated key.
  # mcp_api_key:
  #   file: ./secrets/mcp_api_key.txt
  # Per-PLC passwords — add one entry per IP (use underscores in the secret name):
  # plc_password_192_168_2_17:
  #   file: ./secrets/plc_password_192_168_2_17.txt
  # plc_password_192_168_42_42:
  #   file: ./secrets/plc_password_192_168_42_42.txt

services:
  wago-plc-mcp-server:
    image: wagoalex/wago-plc-mcp-server:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: base  # production stage — pins build.sh and default `docker compose build`
                    # to the prod image. Dev/test image is opt-in via docker-compose.dev.yml.
    container_name: wmcp
    env_file:
      - .env
    environment:
      AUDIT_LOG_FILE: /app/data/audit.log
    restart: unless-stopped
    secrets:
      - plc_default_password
      # - mcp_api_key  # uncomment once secrets/mcp_api_key.txt exists
      # - plc_password_192_168_2_17
      # - plc_password_192_168_42_42

    volumes:
      - ./data:/app/data  # persists auto-generated API key across container recreations

    # ── Pattern A: Host networking (default for routed PLC subnets) ──
    # Use this when your PLCs are on a subnet reachable from the host.
    # The container shares the host's IP and routing table.
    network_mode: host

    # ── Pattern B: Bridge networking with port forward (cloud / portable) ──
    # Comment out 'network_mode: host' above and uncomment the block below.
    # PLCs must be reachable from the host's outbound interface.
    #
    # ports:
    #   - "6042:6042"
    # networks:
    #   - waa

    # ── Optional: live code mount for development (no rebuild needed) ──
    # volumes:
    #   - ./src:/app/src:ro

    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 2 http://localhost:6042/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Uncomment when using Pattern B
# networks:
#   wago-net:
#     driver: bridge
